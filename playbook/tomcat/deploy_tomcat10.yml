---
- name: Despliegue Centralizado de Tomcat 10 y JMX Exporter
  hosts: server7 # Cambia al grupo de tus servidores
  become: yes
  vars:
    # --- 1. VARIABLES DE TOMCAT ---
    paquete_tomcat10_local: "/etc/ansible/playbook/tomcat/apache-tomcat-10.1.52.tar.gz"
    tomcat_home: "/opt/tomcat/apache-tomcat"
    tomcat_user: "tomcat"
    tomcat_group: "tomcat"
    
    # --- 2. VARIABLES DE JAVA (Memoria y JMX) ---
    java_xms: "256m"
    java_xmx: "2g"
    jmx_user: "admin"
    jmx_pass: "C8pMfQtaD!"
    dir_jmx_local: "/etc/ansible/playbook/tomcat"
    dir_jmx_remoto: "/opt/tomcat/jmx_exporter"
    
    # --- 3. VARIABLES DE BACKUP ---
    fecha_backup: "{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}"
    dir_backup: "/opt/tomcat/tomcat_backup_{{ fecha_backup }}"

  tasks:
    # =========================================================
    # FASE 1: PARADA, LIMPIEZA DE BACKUPS VIEJOS Y BACKUP NUEVO
    # =========================================================
    - name: 1.1 Detener el servicio actual de Tomcat (si existe)
      systemd:
        name: tomcat
        state: stopped
      ignore_errors: yes

    - name: 1.2 Comprobar si existe una instalación previa de Tomcat
      stat:
        path: "{{ tomcat_home }}"
      register: tomcat_actual

    - name: 1.3 Buscar backups antiguos de Tomcat en /opt/tomcat
      find:
        paths: /opt/tomcat
        patterns: "tomcat_backup_*"
        file_type: directory
      register: backups_antiguos

    - name: 1.4 Eliminar backups antiguos (para mantener solo 1)
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ backups_antiguos.files }}"

    - name: 1.5 Crear directorio para el NUEVO backup
      file:
        path: "{{ dir_backup }}"
        state: directory
      when: tomcat_actual.stat.exists

    - name: 1.6 Respaldar el Tomcat actual
      command: cp -a {{ tomcat_home }} {{ dir_backup }}/
      when: tomcat_actual.stat.exists

    # =========================================================
    # FASE 2: LIMPIEZA, DESPLIEGUE Y CONFIGURACIÓN (server.xml)
    # =========================================================
    - name: 2.1 Eliminar el directorio del Tomcat antiguo
      file:
        path: "{{ tomcat_home }}"
        state: absent

    - name: 2.2 Recrear la estructura de carpetas limpia
      file:
        path: "{{ tomcat_home }}"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"

    - name: 2.3 Descomprimir Tomcat 10 centralizado
      unarchive:
        src: "{{ paquete_tomcat10_local }}"
        dest: "{{ tomcat_home }}"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        extra_opts: [--strip-components=1]
        remote_src: no

    - name: 2.4 Inyectar scheme="https" en el Connector 8080 (server.xml)
      replace:
        path: "{{ tomcat_home }}/conf/server.xml"
        # Busca el conector por defecto de Tomcat
        regexp: '(<Connector port="8080" protocol="HTTP/1.1")'
        # Inyecta el scheme justo a continuación
        replace: '\1 scheme="https"'

    # =========================================================
    # FASE 3: CONFIGURACIÓN JMX EXPORTER, JMX REMOTE Y SETENV
    # =========================================================
    - name: 3.1 Crear directorio para JMX Exporter
      file:
        path: "{{ dir_jmx_remoto }}"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"

    - name: 3.2 Copiar agente JMX Prometheus y configuración
      copy:
        src: "{{ dir_jmx_local }}/{{ item }}"
        dest: "{{ dir_jmx_remoto }}/{{ item }}"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
      loop:
        - jmx_prometheus_javaagent-0.20.0.jar
        - tomcat.yml

    - name: 3.3 Configurar acceso JMX (jmxremote.access)
      copy:
        dest: "{{ tomcat_home }}/conf/jmxremote.access"
        content: "{{ jmx_user }} readwrite\n"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        mode: '0600'

    - name: 3.4 Configurar contraseña JMX (jmxremote.password)
      copy:
        dest: "{{ tomcat_home }}/conf/jmxremote.password"
        content: "{{ jmx_user }} {{ jmx_pass }}\n"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        mode: '0600'

    - name: 3.5 Crear el archivo setenv.sh con variables dinámicas
      copy:
        dest: "{{ tomcat_home }}/bin/setenv.sh"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        mode: '0755'
        content: |
          #!/bin/bash
          JAVA_OPTS="$JAVA_OPTS \
           -Dcom.sun.management.jmxremote \
           -Dcom.sun.management.jmxremote.port=9010 \
           -Dcom.sun.management.jmxremote.rmi.port=9010 \
           -Dcom.sun.management.jmxremote.local.only=false \
           -Dcom.sun.management.jmxremote.authenticate=true \
           -Dcom.sun.management.jmxremote.ssl=false \
           -Dcom.sun.management.jmxremote.password.file={{ tomcat_home }}/conf/jmxremote.password \
           -Dcom.sun.management.jmxremote.access.file={{ tomcat_home }}/conf/jmxremote.access \
           -Djava.rmi.server.hostname={{ inventory_hostname }}"
          
          export JAVA_OPTS="$JAVA_OPTS -javaagent:{{ dir_jmx_remoto }}/jmx_prometheus_javaagent-0.20.0.jar=9404:{{ dir_jmx_remoto }}/tomcat.yml"
          export JAVA_OPTS="-Xms{{ java_xms }} -Xmx{{ java_xmx }} $JAVA_OPTS"

    - name: 3.6 Comprobar si ya existe el servicio systemd de Tomcat
      stat:
        path: /etc/systemd/system/tomcat.service
      register: servicio_tomcat

    - name: 3.7 Crear tomcat.service estándar (SOLO SI NO EXISTE)
      copy:
        dest: /etc/systemd/system/tomcat.service
        content: |
          [Unit]
          Description=Apache Tomcat Web Application Container
          After=network.target
          
          [Service]
          Type=forking
          
          Environment="JAVA_HOME=/usr/lib/jvm/java-21-openjdk"
          Environment="CATALINA_PID={{ tomcat_home }}/temp/tomcat.pid"
          Environment="CATALINA_HOME={{ tomcat_home }}"
          Environment="CATALINA_BASE={{ tomcat_home }}"
          
          Environment="JAVA_OPTS=-Djava.awt.headless=true -Djava.security.egd=file:/dev/./urandom"
          
          ExecStart={{ tomcat_home }}/bin/startup.sh
          ExecStop={{ tomcat_home }}/bin/shutdown.sh
          
          User={{ tomcat_user }}
          Group={{ tomcat_group }}
          UMask=0007
          RestartSec=10
          Restart=always
          
          [Install]
          WantedBy=multi-user.target
      when: not servicio_tomcat.stat.exists

    # =========================================================
    # FASE 4: FIREWALL Y RECARGA
    # =========================================================
    - name: 4.1 Abrir el puerto 9010/tcp para JMX en Firewalld (Permanente)
      command: firewall-cmd --add-port=9010/tcp --permanent
      ignore_errors: yes

    - name: 4.2 Recargar Firewalld
      command: firewall-cmd --reload
      ignore_errors: yes

    - name: 4.3 Recargar demonios de Systemd
      systemd:
        daemon_reload: yes

    - name: 4.4 Habilitar y arrancar Tomcat
      systemd:
        name: tomcat
        enabled: yes
        state: restarted
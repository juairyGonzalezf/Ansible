---
- name: Comprobar servidores WebLogic que necesitan reinicio
  hosts: "{{ target }}"  # Cambia 'all' por tu grupo de inventario si lo necesitas (ej. weblogic_int)
  become: yes
  become_user: oracle
  tasks:
    - name: Verificar que se han especificado el servidores a comprobar
      fail:
        msg: >
          ERROR: Debes especificar el servidores. 
          Ejemplo: ansible-playbook playbook_check_reinicios.yml -e "target=server3"
      when: target == ""

    - name: Aprovisionar script comprobar_reinicios.sh al servidor destino
      copy:
        src: /etc/ansible/playbook/wls/comprobar_reinicios.sh
        dest: /disc2/scripts/comprobar_reinicios.sh
        owner: oracle
        mode: '0755'

    - name: Ejecutar script de comprobacion
      command: /disc2/scripts/comprobar_reinicios.sh
      register: resultado_check
      changed_when: false # Evita que Ansible lo marque como "Changed" ya que solo es lectura

    - name: Mostrar resultado por pantalla
      debug:
        var: resultado_check.stdout_lines

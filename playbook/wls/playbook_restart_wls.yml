---
# Usamos un 'default' para que si no pasas target, no falle de golpe y muestre la ayuda
- name: Reiniciar servidores WebLogic en paralelo
  hosts: "{{ target | default('localhost') }}"
  gather_facts: no 
  become: yes
  become_user: oracle
  vars:
    target: ""
    servidores: ""
    admin_service_name: "weblogic1411-admin.service"
    node_manager_service_name: "weblogic-nodemanager.service"
    
    # --- VARIABLES DE WEBLOGIC PARA LA PLANTILLA (¡Ajusta a tu entorno!) ---
    wls_user: "weblogic"
    wls_pass: "Juanmanuel12.,|@" 
    wls_domain_path: "/disc2/bea/WLS_14_1"
    
  tasks:
    - name: Verificar que se han especificado los parametros requeridos
      fail:
        msg: |
          ========================================================================
          ERROR: Faltan parametros obligatorios para ejecutar el Playbook.
          
          USO CORRECTO: 
          ansible-playbook playbook_restart_wls.yml -e "target=<host> servidores='<lista>'"
          
          OPCIONES PARA 'servidores':
            - 'NodeManager'       : Reinicia el Node Manager
            - 'AdminServer'       : Reinicia el Admin Server
            - 'server1 server2'   : Reinicia Managed Servers especificos
            - 'all'               : Reinicia TODOS los Managed Servers
            
          EJEMPLOS:
            Reiniciar todo:        -e "target=server3,server4 servidores='all AdminServer NodeManager'"
            Reiniciar un managed:  -e "target=server3 servidores='app_server1'"
          ========================================================================
      when: target == "" or target == "localhost" or servidores == ""

    - name: Setear lista general de servidores
      set_fact:
        lista_servidores: "{{ servidores.split() }}"

    # =========================================================================
    # PRE-COMPROBACIÓN: ¿Existen los servicios en esta máquina?
    # =========================================================================
    - name: Comprobar si existe el servicio del NodeManager en este host
      command: "systemctl cat {{ node_manager_service_name }}"
      register: check_nm
      failed_when: false
      changed_when: false
      become_user: root

    - name: Comprobar si existe el servicio del AdminServer en este host
      command: "systemctl cat {{ admin_service_name }}"
      register: check_admin
      failed_when: false
      changed_when: false
      become_user: root

    # =========================================================================
    # BLOQUE 1: NODEMANAGER
    # =========================================================================
    - name: Gestionar reinicio del NodeManager
      block:
        - name: Reiniciar servicio de Systemd del NodeManager
          service:
            name: "{{ node_manager_service_name }}"
            state: restarted
          become_user: root

        - name: Esperar a que el NodeManager este levantado (puerto 5556)
          wait_for:
            host: "{{ inventory_hostname }}" 
            port: 5556
            delay: 5
            timeout: 120
            state: started
            
      when: "'NodeManager' in lista_servidores and check_nm.rc == 0"

    # =========================================================================
    # BLOQUE 2: ADMINSERVER
    # =========================================================================
    - name: Gestionar reinicio del AdminServer
      block:
        - name: Reiniciar servicio de Systemd del AdminServer
          service:
            name: "{{ admin_service_name }}"
            state: restarted
          become_user: root

        - name: Esperar a que el AdminServer este levantado (puerto 7004)
          wait_for:
            host: "{{ inventory_hostname }}"
            port: 7004
            delay: 10
            timeout: 300
            state: started
            
      when: "'AdminServer' in lista_servidores and check_admin.rc == 0"

    # =========================================================================
    # PREPARACION BLOQUE 3: Extraer solo los Managed Servers
    # =========================================================================
    - name: Crear lista solo con Managed Servers (sin AdminServer ni NodeManager)
      set_fact:
        lista_managed: "{{ lista_servidores | reject('search', '^(AdminServer|NodeManager)$') | list }}"

    # =========================================================================
    # BLOQUE 3: MANAGED SERVERS
    # IMPORTANTE: Esto SOLO se ejecuta desde la máquina que tiene el AdminServer
    # =========================================================================
    - name: Gestionar reinicio de Managed Servers (Solo desde el nodo Admin)
      block:
        - name: Aprovisionar script restart.sh al servidor destino (Template)
          template:
            src: /etc/ansible/playbook/wls/restart.sh
            dest: /disc2/scripts/restart.sh
            owner: oracle
            group: oracle
            mode: '0755'

        - name: Ejecutar script de reinicio para Managed Servers
          command: "/disc2/scripts/restart.sh {{ lista_managed | join(' ') }}"
          register: resultado_reinicio
          async: 900 # Le damos 15 minutos de máximo por si hay muchos servidores
          poll: 10

        - name: Mostrar progreso y resultado de los Managed Servers (Stdout y Stderr)
          debug:
            msg: 
              - "=== SALIDA NORMAL ==="
              - "{{ resultado_reinicio.stdout_lines | default([]) }}"
              - "=== POSIBLES ERRORES ==="
              - "{{ resultado_reinicio.stderr_lines | default([]) }}"
            
      when: lista_managed | length > 0 and check_admin.rc == 0
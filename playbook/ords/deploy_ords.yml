---
- name: Despliegue de ORDS y migración a Tomcat 10 (Jakarta)
  hosts: server7 # Cambia al grupo de tus servidores
  become: yes
  vars:
    # --- 1. VARIABLES DE VERSIONES Y BBDD ---
    ords_version: "25.1" # Cambia esto cuando bajes una versión nueva
    db_host: "isses-db25101tic-scan.region.iss.biz"
    db_port: "1521"
    servicio_bbdd: "oraclepdb1" # Cambiar para cada despliegue (ej. GESTIOD_PDB)
    db_sys_user: "sys"
    db_sys_pass: "TuPasswordSYS" 
    ords_public_pass: "TuPasswordORDS"
    
    # --- 2. RUTAS LOCALES (En el servidor de Ansible) ---
    dir_local_ords: "/etc/ansible/playbook/ords"
    paquete_ords: "{{ dir_local_ords }}/ords-latest.zip"
    paquete_jakarta: "{{ dir_local_ords }}/jakartaee-migration-1.0.10-bin.zip"
    dir_local_imagenes_apex: "{{ dir_local_ords }}/apex_images" 
    
    # --- 3. RUTAS DESTINO (En el servidor Tomcat) ---
    tomcat_home: "/opt/tomcat/apache-tomcat"
    # La carpeta ahora lleva el nombre de la versión dinámicamente
    ords_bin_dir: "/home/tomcat/ords/ords{{ ords_version }}" 
    ords_config_dir: "/opt/tomcat/ords_{{ servicio_bbdd }}"
    jakarta_dir: "/home/tomcat/ords/tomcatMigrationTool"
    
    # Rutas Webapps
    war_destino: "{{ tomcat_home }}/webapps/ords_{{ servicio_bbdd }}.war"
    imagenes_destino: "{{ tomcat_home }}/webapps/i_{{ servicio_bbdd }}"
    
    tomcat_user: "tomcat"
    tomcat_group: "tomcat"

  tasks:
    # =========================================================
    # FASE 1: PROVISIONAMIENTO DE HERRAMIENTAS
    # =========================================================
    - name: 1.1 Crear directorios base (Solo si no existen)
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
      loop:
        - "{{ ords_bin_dir }}"
        - "{{ ords_config_dir }}"
        - "{{ jakarta_dir }}"

    - name: 1.2 Descomprimir binarios de ORDS {{ ords_version }}
      unarchive:
        src: "{{ paquete_ords }}"
        dest: "{{ ords_bin_dir }}"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        remote_src: no
        creates: "{{ ords_bin_dir }}/bin/ords" # Salta la tarea si el binario ya existe

    - name: 1.3 Descomprimir Jakarta Migration Tool
      unarchive:
        src: "{{ paquete_jakarta }}"
        dest: "{{ jakarta_dir }}"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        extra_opts: [--strip-components=1]
        remote_src: no
        creates: "{{ jakarta_dir }}/lib/jakartaee-migration-1.0.10.jar"

    # =========================================================
    # FASE 2: COMPROBACIÓN BBDD Y TRUCO DE LA VISTA 23c
    # =========================================================
    - name: 2.1 Crear script SQL para comprobar si ORDS ya existe
      copy:
        dest: "/tmp/check_ords.sql"
        content: |
          SET HEADING OFF;
          SET FEEDBACK OFF;
          SELECT count(*) FROM dba_users WHERE username = 'ORDS_PUBLIC_USER';
          EXIT;
      become: yes
      become_user: "{{ tomcat_user }}"

    - name: 2.2 Consultar la BBDD con SQLcl
      # sql -S es el modo silencioso de sqlcl
      command: sql -S {{ db_sys_user }}/"{{ db_sys_pass }}"@//{{ db_host }}:{{ db_port }}/{{ servicio_bbdd }} as sysdba @/tmp/check_ords.sql
      register: check_ords_db
      changed_when: false
      become: yes
      become_user: "{{ tomcat_user }}"

    - name: 2.3 Crear script de parcheo de vista para Oracle 23c
      copy:
        dest: "/tmp/parche_vista_23c.sql"
        content: |
          ALTER SESSION SET "_oracle_script"=true;
          CREATE OR REPLACE VIEW sys.product_component_version_bkp AS SELECT * FROM sys.product_component_version;
          CREATE OR REPLACE VIEW sys.product_component_version AS
          SELECT 'Oracle Database 23c Enterprise Edition' AS product, '23.0.0.0.0' AS version, '23.0.0.0.0' AS version_full, 'Production' AS status FROM dual;
          ALTER SESSION SET "_oracle_script"=false;
          exit;
      when: check_ords_db.stdout | trim == '0' # Solo lo crea si el usuario no existe

    - name: 2.4 Parchear vista 23c (SOLO si ORDS NO está instalado en BBDD)
      command: sql -S {{ db_sys_user }}/"{{ db_sys_pass }}"@//{{ db_host }}:{{ db_port }}/{{ servicio_bbdd }} as sysdba @/tmp/parche_vista_23c.sql
      when: check_ords_db.stdout | trim == '0' # Condición estricta
      become: yes
      become_user: "{{ tomcat_user }}"

    # =========================================================
    # FASE 3: INSTALACIÓN SILENCIOSA DE ORDS
    # =========================================================
    - name: 3.1 Instalar o Configurar ORDS en modo silencioso
      shell: |
        echo -e "{{ db_sys_pass }}\n{{ ords_public_pass }}" | {{ ords_bin_dir }}/bin/ords --config {{ ords_config_dir }} install \
        --admin-user "{{ db_sys_user }} AS SYSDBA" \
        --db-hostname {{ db_host }} \
        --db-port {{ db_port }} \
        --db-servicename {{ servicio_bbdd }} \
        --feature-sdw true \
        --password-stdin
      become: yes
      become_user: "{{ tomcat_user }}"
      no_log: true # Protege las contraseñas en los logs

    # =========================================================
    # FASE 4: PREPARACIÓN Y MIGRACIÓN DEL WAR (JAKARTA)
    # =========================================================
    - name: 4.1 Generar el archivo .war original (javax) inyectando la configuración
      command: "{{ ords_bin_dir }}/bin/ords --config {{ ords_config_dir }} war /tmp/ords_{{ servicio_bbdd }}_viejo.war"
      become: yes
      become_user: "{{ tomcat_user }}"

    - name: 4.2 Convertir el .war a Jakarta 10 directamente en Tomcat webapps
      command: java -jar {{ jakarta_dir }}/lib/jakartaee-migration-1.0.10.jar /tmp/ords_{{ servicio_bbdd }}_viejo.war {{ war_destino }}
      become: yes
      become_user: "{{ tomcat_user }}"

    - name: 4.3 Limpiar war temporal
      file:
        path: "/tmp/ords_{{ servicio_bbdd }}_viejo.war"
        state: absent

    # =========================================================
    # FASE 5: IMÁGENES APEX Y ARCHIVO POOL.XML
    # =========================================================
    - name: 5.1 Crear directorio de imágenes para {{ servicio_bbdd }}
      file:
        path: "{{ imagenes_destino }}"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"

    - name: 5.2 Copiar imágenes estáticas de APEX al directorio del ORDS
      copy:
        src: "{{ dir_local_imagenes_apex }}/"
        dest: "{{ imagenes_destino }}/"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"

    - name: 5.3 Configurar misc.defaultPage a apex en pool.xml
      lineinfile:
        path: "{{ ords_config_dir }}/databases/default/pool.xml"
        insertbefore: '^</properties>'
        line: '    <entry key="misc.defaultPage">apex</entry>'
      become: yes
      become_user: "{{ tomcat_user }}"

    # =========================================================
    # FASE 6: REINICIO DE TOMCAT PARA APLICAR
    # =========================================================
    - name: 6.1 Reiniciar Tomcat
      systemd:
        name: tomcat
        state: restarted